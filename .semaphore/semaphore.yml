version: v1.0
name: Pipeline One
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2204
global_job_config:
  epilogue:
    always:
      commands:
        - test-results resource-metrics report.md
        - test-results command-metrics report.md
        - artifact push job -d .semaphore/REPORT.md report.md
        - artifact push workflow -d .semaphore/REPORT.md report.md
blocks:
  - name: 'Block #1'
    task:
      jobs:
        - name: Hello Job
          commands:
            - echo "Hello world!"
      env_vars: []
    dependencies: []
promotions:
  - name: Prod Promotion
    pipeline_file: pipeline_5.yml
    auto_promote:
      when: branch = 'queues'
  - name: Dev Promotion
    pipeline_file: pipeline_6.yml
    auto_promote:
      when: branch = 'queues'
